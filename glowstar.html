<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glowstar Cafe</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --white:#fff;
  --black:#1d1d1f;
  --grey:#f5f5f7;
  --gold:#c69c6d;
}

body {
  margin:0;
  font-family:Inter;
  overflow-x:hidden;
}

/* NAVBAR */
.navbar {
  display:flex;
  justify-content:space-between;
  padding:15px 20px;
  position:fixed;
  width:100%;
  background:#fff;
  z-index:1000;
}

.nav-logo {
  font-weight:bold;
}

.nav-links {
  display:flex;
  gap:20px;
}

.nav-links a {
  text-decoration:none;
  color:black;
}

/* HAMBURGER */
.menu-btn {
  display:none;
  font-size:24px;
  cursor:pointer;
}

/* HERO */
.hero {
  height:100vh;
  background:url("coffe.jpg") center/cover;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:white;
  position:relative;
}

.hero::before {
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.4);
}

.hero-content {
  position:relative;
  padding:20px;
}

.hero h1 {
  font-size:60px;
  margin:0;
}

.hero p {
  font-size:18px;
}

.btn {
  padding:12px 25px;
  border-radius:30px;
  text-decoration:none;
  display:inline-block;
  margin:5px;
}

.btn1 {background:white;color:black;}
.btn2 {border:1px solid white;color:white;}

/* SECTION */
.section {
  padding:80px 20px;
}

/* SIGNATURE */
.sig {
  display:flex;
  gap:40px;
  margin-bottom:60px;
}

.sig img {
  width:100%;
  border-radius:15px;
}

.sig-text {
  flex:1;
}

/* GRID MOBILE FIX */
@media(max-width:768px){

  .menu-btn {
    display:block;
  }

  .nav-links {
    position:absolute;
    top:60px;
    right:0;
    background:white;
    flex-direction:column;
    width:200px;
    display:none;
    padding:20px;
  }

  .nav-links.active {
    display:flex;
  }

  .hero h1 {
    font-size:36px;
  }

  .sig {
    flex-direction:column;
  }

}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="nav-logo">GLOWSTAR</div>

  <div class="menu-btn" onclick="toggleMenu()">☰</div>

  <div class="nav-links" id="nav">
    <a href="#">Menu</a>
    <a href="#signature">Signature</a>
    <a href="#location">Lokasi</a>
    <a href="#about">Tentang</a>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <div class="hero-content">
    <h1>Glowstar Cafe</h1>
    <p>Kopi premium & pengalaman modern</p>
    <a href="#" class="btn btn1">Menu</a>
    <a href="#signature" class="btn btn2">Lihat</a>
  </div>
</div>

<!-- SIGNATURE -->
<div id="signature" class="section">

  <div class="sig">
    <div><img src="https://images.unsplash.com/photo-1541167760496-1628856ab772"></div>
    <div class="sig-text">
      <h2>Golden Latte</h2>
      <p>Kopi premium dengan rasa unik.</p>
    </div>
  </div>

  <div class="sig">
    <div><img src="https://images.unsplash.com/photo-1555507036-ab1f4038808a"></div>
    <div class="sig-text">
      <h2>Croissant</h2>
      <p>Pastry lembut dan fresh.</p>
    </div>
  </div>

</div>

<!-- ABOUT -->
<div id="about" class="section" style="background:#f5f5f7;text-align:center;">
  <h2>Tentang Kami</h2>
  <p>Kopi bukan sekadar minuman, tapi pengalaman.</p>
</div>

<!-- LOCATION -->
<div id="location" class="section">
  <h2>Lokasi</h2>
  <p>Jl. Contoh No 123</p>
</div>

<script>
function toggleMenu(){
  document.getElementById("nav").classList.toggle("active");
}
</script>

</body>
</html>
