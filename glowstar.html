<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glowstar Cafe | Material Design</title>
  <!-- Menggunakan font Roboto standar Material Design -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --md-sys-color-primary: #6750a4;
      --md-sys-color-surface: #fef7ff;
      --md-sys-color-on-surface: #1d1b20;
      --md-sys-elevation: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--md-sys-color-surface);
      margin: 0;
    }

    /* Card Style - Material Design */
    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--md-sys-elevation);
      transition: box-shadow 0.3s;
    }
    .card:hover {
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
    }

    /* Floating Action Button (FAB) */
    .fab {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background-color: var(--md-sys-color-primary);
      color: white;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      cursor: pointer;
      font-size: 24px;
      z-index: 1000;
      text-decoration: none;
    }

    /* Buttons - Material Style */
    .btn {
      padding: 10px 24px;
      border-radius: 20px;
      text-transform: uppercase;
      font-weight: 500;
      border: none;
      cursor: pointer;
    }
    .btn-filled { background-color: var(--md-sys-color-primary); color: white; }
    
    /* Responsive Grid */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      padding: 20px;
    }
  </style>
</head>
<body>

  <!-- FAB Example -->
  <a href="javascript:void(0)" class="fab" onclick="openMenu()">+</a>

  <section class="menu-grid">
    <!-- Contoh Card Material Design -->
    <div class="card">
      <h3 style="margin-top:0">Glowstar Golden Latte</h3>
      <p>Perpaduan espresso arabika pilihan dengan susu oat.</p>
      <div style="color: var(--md-sys-color-primary); font-weight: bold;">Rp 35.000</div>
    </div>
    
    <div class="card">
      <h3 style="margin-top:0">Royal Almond Croissant</h3>
      <p>Pastry mentega dengan isian almond manis.</p>
      <div style="color: var(--md-sys-color-primary); font-weight: bold;">Rp 28.000</div>
    </div>
  </section>

  <script>
    // Logika Anda tetap sama
    function openMenu() { alert("Membuka menu dengan gaya Material..."); }
  </script>
</body>
</html>
